<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator">
        <div id="display" class="display">0</div>
        <div class="buttons">
            <button onclick="clearDisplay()">clr</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="append('%')">%</button>
            <button onclick="append('/')">/</button>
            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button onclick="append('*')">*</button>
            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button onclick="append('-')">-</button>
            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="append('+')">+</button>
            <button onclick="append('.')">.</button>
            <button onclick="append('0')">0</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>
    <audio id="clickSound" src="https://www.soundjay.com/buttons/button-09.wav" preload="auto"></audio>
    

   <style>

.container {
    position: fixed;
    bottom: 25px;
    right: 25px;
}

.exit-btn {
    text-decoration: none;
}

.exit-btn span {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 50px;
    background: linear-gradient(45deg, #00e0ff, #0077ff);
    color: #000;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 0 10px #00e0ff;
    position: relative;
    overflow: hidden;
}

/* Hover Effect */
.exit-btn span:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 0 20px #00e0ff, 0 0 40px #0077ff;
}

/* Click Effect */
.exit-btn span:active {
    transform: scale(0.95);
}

/* Subtle Floating Animation */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-4px); }
    100% { transform: translateY(0px); }
}

.exit-btn span {
    animation: float 3s ease-in-out infinite;
}

</style>


<div class="container">

    <a href="../portfolio.html#projects" class="exit-btn">
        <span>Exit</span>
    </a>
</div>
<script src="calculator.js"></script>
</body>
</html>
